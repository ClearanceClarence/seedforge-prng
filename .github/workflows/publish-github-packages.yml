# Publishes the package to GitHub Packages so it shows up in the
# "Packages" box on the repository page.
#
# Runs automatically when a version tag (v1.1.1, v1.2.0, ...) is pushed,
# and can be started by hand from the Actions tab.
#
# The package on npmjs.com is not affected: this publishes a second copy
# under the scoped name @<owner>/seedforge-prng, which GitHub requires.

name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          registry-url: 'https://npm.pkg.github.com'

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Use the scoped package name
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          NAME="$(node -p "require('./package.json').name")"
          npm pkg set name="@$OWNER/$NAME"
          echo "Publishing $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"

      # "npm publish" runs the build and the full test suite first
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
